name: Render LING406 visual previews
on:
  push:
    branches: [preview/ling406-visual-videos]
    paths:
      - 'ling406/visual-previews/**'
      - 'ling406/visual-previews.js'
      - 'ling406/visual-previews.css'
      - '.github/workflows/ling406-visual-previews.yml'
permissions:
  contents: write
concurrency:
  group: ling406-visual-previews
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ling406-visual-videos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow==11.3.0
      - name: Render and validate clips
        run: |
          python ling406/visual-previews/render.py
          python ling406/visual-previews/verify.py
      - name: Browser integration checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chrome
          node ling406/visual-previews/browser-test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ling406-visual-previews
          path: |
            ling406/visual-previews/clips
            ling406/visual-previews/posters
            ling406/visual-previews/validation.json
            ling406/visual-previews/browser-validation.json
            ling406/visual-previews/qa
      - name: Save verified media to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ling406/visual-previews/clips ling406/visual-previews/posters ling406/visual-previews/validation.json ling406/visual-previews/browser-validation.json ling406/visual-previews/qa
          git diff --cached --quiet && exit 0
          git commit -m "Render and verify LING406 visual experiment videos"
          git push origin HEAD:preview/ling406-visual-videos
