name: LING285 media audit
on:
  push:
    branches: [preview/ling285-stimuli]
    paths: ['ling285/stimuli/authoring/audit.py', '.github/workflows/ling285-media-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python ling285/stimuli/authoring/audit.py
      - name: Save remote audit
        run: |
          git config user.name "Study Studio media"
          git config user.email "actions@users.noreply.github.com"
          git add ling285/stimuli/qa
          git commit -m "Audit original LING285 media and slide displays"
          git push
