name: Render PSYC301 experiment videos
on:
  push:
    branches: [preview/psyc301-visual-videos]
    paths:
      - 'psyc301-videos/**'
      - 'authoring/psyc301/visual-videos/*.py'
      - 'authoring/psyc301/visual-videos/*.cjs'
      - '.github/workflows/psyc301-visual-videos.yml'
permissions:
  contents: write
concurrency:
  group: psyc301-visual-videos
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/psyc301-visual-videos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow==11.3.0
      - name: Render and validate
        run: |
          python authoring/psyc301/visual-videos/render.py
          python authoring/psyc301/visual-videos/verify.py
          python authoring/psyc301/visual-videos/integrate.py
      - name: Browser and preservation checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chrome
          node authoring/psyc301/visual-videos/browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psyc301-video-previews
          path: |
            psyc301-videos
      - name: Commit verified previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psyc301-videos index.html share.html
          git diff --cached --quiet && exit 0
          git commit -m "Add rendered PSYC301 videos beside matching slides"
          git push origin HEAD:preview/psyc301-visual-videos
