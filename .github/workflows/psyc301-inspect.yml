name: PSYC301 remote inspection
on:
  push:
    branches: [preview/psyc301-visual-videos]
    paths: ['.github/workflows/psyc301-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract code for review
        run: |
          mkdir -p authoring/psyc301/visual-videos
          python - <<'PY'
          import re,pathlib
          p=pathlib.Path('index.html')
          s=re.sub(r'data:image/[^;"\s]+;base64,[A-Za-z0-9+/=\s]+','IMAGE_DATA_REMOVED',p.read_text())
          pathlib.Path('authoring/psyc301/visual-videos/index-inspection.txt').write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/psyc301/visual-videos/index-inspection.txt
          git commit -m "Extract PSYC301 code for remote video integration review"
          git push
